# Déploiement Netlify — voir README.md, section « Mise en ligne ».

[build]
  command = "npm run build && bash outils-domaine.sh"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Le HTML est régénéré à chaque publication : on le revalide systématiquement,
# tandis que les fichiers empreintés (images, JS) sont mis en cache un an.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le calendrier interroge cette adresse ; la fonction relaie les flux iCal que
# le navigateur ne peut pas lire lui-même (CORS).
[[redirects]]
  from = "/api/disponibilites"
  to = "/.netlify/functions/disponibilites"
  status = 200
